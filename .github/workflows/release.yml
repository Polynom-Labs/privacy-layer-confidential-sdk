name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install

      - run: npm run verify

      - run: npm pack --workspace @arcanetech/privacy-sdk-core --dry-run
      - run: npm pack --workspace @arcanetech/privacy-sdk-relay --dry-run
      - run: npm pack --workspace @arcanetech/privacy-sdk-stellar --dry-run
      - run: npm pack --workspace @arcanetech/privacy-sdk-state-redux --dry-run
      - run: npm pack --workspace @arcanetech/privacy-sdk-state-memory --dry-run

      - name: Publish workspace packages
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'chore: release main') }}
        run: bash scripts/publish-workspace-packages.sh
