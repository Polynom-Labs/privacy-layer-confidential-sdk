name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          scope: '@arcanetech'

      - run: npm install

      - run: npm run verify

      - run: npm pack --workspace @arcanetech/privacy-sdk-core --dry-run
      - run: npm pack --workspace @arcanetech/privacy-sdk-stellar --dry-run
      - run: npm pack --workspace @arcanetech/privacy-sdk-state-redux --dry-run
      - run: npm pack --workspace @arcanetech/privacy-sdk-state-memory --dry-run

      - name: Publish workspace packages
        if: "${{ contains(github.event.head_commit.message, 'chore(main): release') }}"
        run: |
          npm publish --workspace @arcanetech/privacy-sdk-core --access public --provenance
          npm publish --workspace @arcanetech/privacy-sdk-stellar --access public --provenance
          npm publish --workspace @arcanetech/privacy-sdk-state-redux --access public --provenance
          npm publish --workspace @arcanetech/privacy-sdk-state-memory --access public --provenance
