name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run verify

      - run: npm pack --workspace @arcane/privacy-sdk-core --dry-run
      - run: npm pack --workspace @arcane/privacy-sdk-stellar --dry-run

      - name: Publish workspace packages
        if: ${{ contains(github.event.head_commit.message, 'chore(main): release') }}
        run: |
          npm publish --workspace @arcane/privacy-sdk-core --access public --provenance
          npm publish --workspace @arcane/privacy-sdk-stellar --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
