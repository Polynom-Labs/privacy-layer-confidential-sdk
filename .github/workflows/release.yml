name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: false

      - run: npm install

      - run: npm run verify

      - run: npm pack --workspace @arcanetech/privacy-sdk-core --dry-run
      - run: npm pack --workspace @arcanetech/privacy-sdk-stellar --dry-run
      - run: npm pack --workspace @arcanetech/privacy-sdk-state-redux --dry-run
      - run: npm pack --workspace @arcanetech/privacy-sdk-state-memory --dry-run

      - name: Publish workspace packages
        if: contains(github.event.head_commit.message, 'chore: release main')
        run: |
          set -euo pipefail
          publish_workspace() {
            local workspace="$1"
            local name version
            name="$(npm pkg get name --workspace "$workspace" | tr -d '"')"
            version="$(npm pkg get version --workspace "$workspace" | tr -d '"')"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skip ${name}@${version} (already on npm)"
              return 0
            fi
            npm publish --workspace "$workspace" --access public --provenance
          }
          publish_workspace @arcanetech/privacy-sdk-core
          publish_workspace @arcanetech/privacy-sdk-stellar
          publish_workspace @arcanetech/privacy-sdk-state-redux
          publish_workspace @arcanetech/privacy-sdk-state-memory
